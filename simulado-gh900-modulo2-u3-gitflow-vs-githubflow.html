<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado GH-900 — Git Flow vs GitHub Flow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #080b10;
    --surface: #0e1318;
    --surface2: #141b22;
    --border: #1e2a36;
    --accent: #f0a500;
    --accent-dim: rgba(240,165,0,0.12);
    --accent2: #38bdf8;
    --accent3: #a3e635;
    --text: #e8eef5;
    --text-muted: #4a5f70;
    --correct-bg: #071a10;
    --correct-border: #4ade80;
    --wrong-bg: #1a0707;
    --wrong-border: #f87171;
    --missed-border: #fb923c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; padding: 48px 20px 100px;
    position: relative; overflow-x: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(240,165,0,0.06) 0%, transparent 65%),
      radial-gradient(ellipse 50% 35% at 85% 100%, rgba(56,189,248,0.05) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }

  body::after {
    content: ''; position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(240,165,0,0.02) 49px, rgba(240,165,0,0.02) 50px),
      repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(240,165,0,0.02) 49px, rgba(240,165,0,0.02) 50px);
    pointer-events: none; z-index: 0;
  }

  .container { max-width: 860px; margin: 0 auto; position: relative; z-index: 1; }

  /* HEADER */
  .header { margin-bottom: 56px; animation: slideDown 0.7s cubic-bezier(.16,1,.3,1) both; }

  .eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 12px; border-radius: 3px; border: 1px solid; }
  .t-mod  { color: var(--accent);  border-color: rgba(240,165,0,0.4);   background: rgba(240,165,0,0.07); }
  .t-unit { color: var(--accent2); border-color: rgba(56,189,248,0.4);  background: rgba(56,189,248,0.07); }
  .t-top  { color: var(--accent3); border-color: rgba(163,230,53,0.4);  background: rgba(163,230,53,0.07); }

  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 2s ease-in-out infinite; margin-left: auto; }

  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(50px, 9vw, 90px); line-height: 0.88; letter-spacing: 0.02em; }
  h1 .w1 { color: var(--text); }
  h1 .w2 { color: var(--accent); text-shadow: 0 0 40px rgba(240,165,0,0.3); }
  h1 .w3 { color: var(--accent2); }

  .subtitle { margin-top: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em; }

  /* VERSUS STRIP */
  .versus-strip {
    margin-top: 24px;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 16px;
    padding: 20px 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  }
  .vs-side { text-align: center; }
  .vs-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
  .vs-label.git { color: var(--accent); }
  .vs-label.gh  { color: var(--accent2); }
  .vs-branches { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .branch-pill { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 3px 8px; border-radius: 20px; border: 1px solid; }
  .bp-git { color: var(--accent);  border-color: rgba(240,165,0,0.3);  background: rgba(240,165,0,0.06); }
  .bp-gh  { color: var(--accent2); border-color: rgba(56,189,248,0.3); background: rgba(56,189,248,0.06); }
  .vs-sep { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--border); letter-spacing: 0.1em; }

  /* PROGRESS */
  .progress-wrap { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .progress-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width 0.6s cubic-bezier(.16,1,.3,1); border-radius: 2px; box-shadow: 0 0 10px rgba(240,165,0,0.4); }
  .progress-meta { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-muted); }
  .score-live { color: var(--accent3); font-weight: 700; }

  /* CARD */
  .qcard {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px; margin-bottom: 24px;
    opacity: 0; transform: translateY(20px);
    animation: riseUp 0.48s cubic-bezier(.16,1,.3,1) forwards;
    position: relative; overflow: hidden; transition: border-color 0.3s;
  }
  .qcard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2), transparent); opacity: 0; transition: opacity 0.3s; }
  .qcard:hover::before { opacity: 1; }
  .qcard:hover { border-color: rgba(240,165,0,0.2); }
  .qcard:nth-child(1) { animation-delay: 0.04s; }
  .qcard:nth-child(2) { animation-delay: 0.09s; }
  .qcard:nth-child(3) { animation-delay: 0.14s; }
  .qcard:nth-child(4) { animation-delay: 0.19s; }
  .qcard:nth-child(5) { animation-delay: 0.24s; }

  .qcard-header { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 26px; }
  .qnum { flex-shrink: 0; font-family: 'Bebas Neue', sans-serif; font-size: 46px; line-height: 1; color: var(--border); letter-spacing: 0.02em; min-width: 50px; transition: color 0.3s; }
  .qcard:hover .qnum { color: rgba(240,165,0,0.2); }
  .qmeta { flex: 1; }
  .qtype { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .qtype::before { content: ''; display: inline-block; width: 14px; height: 1px; background: var(--accent); }
  .qtext { font-size: 15.5px; font-weight: 500; line-height: 1.62; color: var(--text); }

  /* OPTIONS */
  .multi-hint { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--missed-border); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .options { display: flex; flex-direction: column; gap: 9px; }

  .opt {
    display: flex; align-items: flex-start; gap: 13px;
    padding: 15px 18px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; transition: all 0.18s ease; user-select: none;
  }
  .opt:hover:not(.disabled) { border-color: var(--accent); background: rgba(240,165,0,0.05); transform: translateX(4px); }
  .opt.disabled { cursor: default; }
  .opt.disabled:hover { transform: none; }
  .opt.correct { background: var(--correct-bg); border-color: var(--correct-border); box-shadow: 0 0 14px rgba(74,222,128,0.07); }
  .opt.wrong   { background: var(--wrong-bg);   border-color: var(--wrong-border); }
  .opt.missed  { background: rgba(251,146,60,0.05); border-color: var(--missed-border); }
  .opt.sel-multi:not(.disabled) { border-color: var(--accent2); background: rgba(56,189,248,0.07); }

  .opt-bubble { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--text-muted); transition: all 0.18s; margin-top: 1px; }
  .opt.correct .opt-bubble { background: var(--correct-border); border-color: var(--correct-border); color: #080b10; }
  .opt.wrong   .opt-bubble { background: var(--wrong-border);   border-color: var(--wrong-border);   color: #fff; }
  .opt.missed  .opt-bubble { background: var(--missed-border);  border-color: var(--missed-border);  color: #080b10; }
  .opt.sel-multi:not(.disabled) .opt-bubble { background: var(--accent2); border-color: var(--accent2); color: #080b10; }

  .opt-letter { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; margin-top: 2px; }
  .opt-text { font-size: 14px; line-height: 1.52; color: var(--text); }

  code { background: rgba(240,165,0,0.09); border: 1px solid rgba(240,165,0,0.22); border-radius: 4px; padding: 1px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #fcd34d; }

  .confirm-btn { margin-top: 16px; padding: 12px 26px; background: var(--accent2); color: #080b10; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .confirm-btn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 4px 18px rgba(56,189,248,0.3); }
  .confirm-btn:disabled { opacity: 0.2; cursor: default; transform: none; filter: none; }

  /* FEEDBACK */
  .feedback { display: none; margin-top: 18px; padding: 18px; border-radius: 10px; font-size: 14px; line-height: 1.65; animation: riseUp 0.3s cubic-bezier(.16,1,.3,1) both; }
  .feedback.fb-ok  { display: block; background: var(--correct-bg); border: 1px solid rgba(74,222,128,0.25); }
  .feedback.fb-err { display: block; background: var(--wrong-bg);   border: 1px solid rgba(248,113,113,0.25); }
  .fb-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .fb-ok  .fb-label { color: var(--correct-border); }
  .fb-err .fb-label { color: var(--wrong-border); }
  .fb-body { color: var(--text); }

  /* RESULT */
  .result-panel { display: none; margin-top: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 56px 40px; text-align: center; animation: riseUp 0.7s cubic-bezier(.16,1,.3,1) both; position: relative; overflow: hidden; }
  .result-panel::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(240,165,0,0.06), transparent); pointer-events: none; }
  .result-panel.show { display: block; }

  .result-ring { width: 130px; height: 130px; border-radius: 50%; margin: 0 auto 28px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 0.04em; position: relative; }
  .result-ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid; }
  .result-ring.pass { color: var(--correct-border); background: rgba(74,222,128,0.06); }
  .result-ring.pass::after { border-color: var(--correct-border); box-shadow: 0 0 30px rgba(74,222,128,0.12); }
  .result-ring.fail { color: var(--wrong-border); background: rgba(248,113,113,0.06); }
  .result-ring.fail::after { border-color: var(--wrong-border); }

  .result-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 0.05em; margin-bottom: 8px; }
  .result-sub { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); margin-bottom: 40px; letter-spacing: 0.04em; }

  .result-stats { display: flex; justify-content: center; gap: 48px; flex-wrap: wrap; margin-bottom: 40px; }
  .stat { text-align: center; }
  .stat-n { font-family: 'Bebas Neue', sans-serif; font-size: 50px; letter-spacing: 0.04em; line-height: 1; }
  .stat-l { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-top: 6px; }
  .stat.ok  .stat-n { color: var(--correct-border); }
  .stat.err .stat-n { color: var(--wrong-border); }
  .stat.pct .stat-n { color: var(--accent); }

  .restart-btn { padding: 14px 38px; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .restart-btn:hover { background: var(--accent-dim); box-shadow: 0 0 22px rgba(240,165,0,0.2); }

  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes riseUp   { from { opacity: 0; transform: translateY(20px);  } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink    { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

  @media (max-width: 600px) {
    .qcard { padding: 20px; } .qnum { font-size: 36px; }
    .versus-strip { grid-template-columns: 1fr; gap: 10px; }
    .vs-sep { display: none; }
    .result-stats { gap: 24px; } .result-panel { padding: 36px 16px; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="eyebrow">
      <span class="tag t-mod">GH-900 · Módulo 2</span>
      <span class="tag t-unit">Unidade 3</span>
      <span class="tag t-top">Git Flow vs GitHub Flow</span>
      <span class="live-dot"></span>
    </div>
    <h1>
      <span class="w1">Git</span> <span class="w2">Flow</span><br>
      <span class="w1">vs</span><br>
      <span class="w3">GitHub Flow</span>
    </h1>
    <p class="subtitle">// 5 questões · foco em fluxos · branches · cenários reais · nível prova GH-900</p>

    <div class="versus-strip">
      <div class="vs-side">
        <div class="vs-label git">Git Flow</div>
        <div class="vs-branches">
          <span class="branch-pill bp-git">main</span>
          <span class="branch-pill bp-git">develop</span>
          <span class="branch-pill bp-git">feature/*</span>
          <span class="branch-pill bp-git">release/*</span>
          <span class="branch-pill bp-git">hotfix/*</span>
        </div>
      </div>
      <div class="vs-sep">VS</div>
      <div class="vs-side">
        <div class="vs-label gh">GitHub Flow</div>
        <div class="vs-branches">
          <span class="branch-pill bp-gh">main</span>
          <span class="branch-pill bp-gh">feature/*</span>
          <span class="branch-pill bp-gh">pull request</span>
          <span class="branch-pill bp-gh">merge</span>
        </div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span id="progressLabel">0 de 5 respondidas</span>
        <span>Acertos: <span class="score-live" id="scoreLive">0</span></span>
      </div>
    </div>
  </header>

  <div id="quiz"></div>
  <div class="result-panel" id="result"></div>

</div>
<script>
const questions = [
  {
    id: 1,
    type: "Única escolha",
    text: "Uma empresa de software lança novas versões do produto a cada 3 meses, com um processo rigoroso de testes e homologação antes de cada release. A equipe precisa de branches dedicados para estabilização da release, correções urgentes em produção e desenvolvimento paralelo de novas funcionalidades. Qual modelo de fluxo de trabalho é mais adequado?",
    options: [
      { l: "A", t: "GitHub Flow — pois seu branch <code>main</code> único garante simplicidade no processo de release trimestral." },
      { l: "B", t: "GitHub Flow — pois os Pull Requests substituem a necessidade de branches de release e hotfix." },
      { l: "C", t: "Git Flow — pois oferece branches dedicados como <code>release/*</code> e <code>hotfix/*</code>, adequados para ciclos de lançamento planejados e versionados." },
      { l: "D", t: "Git Flow — pois é o único modelo que permite correções urgentes em produção sem interromper o desenvolvimento." }
    ],
    correct: ["C"],
    explanation: "O <strong>Git Flow</strong> é o modelo ideal para times com <strong>ciclos de lançamento planejados e versionados</strong>. Ele oferece branches específicos para cada fase: <strong><code>feature/*</code></strong> para novas funcionalidades, <strong><code>develop</code></strong> como integração, <strong><code>release/*</code></strong> para estabilização antes do lançamento e <strong><code>hotfix/*</code></strong> para correções urgentes em produção sem afetar o desenvolvimento em andamento. O GitHub Flow é mais simples mas não tem essa estrutura para releases planejadas."
  },
  {
    id: 2,
    type: "Única escolha",
    text: "No Git Flow, um desenvolvedor precisa corrigir urgentemente um bug crítico que está afetando o ambiente de produção. O branch <code>develop</code> já tem várias funcionalidades novas em desenvolvimento que não estão prontas para produção. Qual branch ele deve usar como base para criar a correção?",
    options: [
      { l: "A", t: "Criar o branch de correção a partir do <code>develop</code>, para que as mudanças novas também sejam testadas junto com o fix." },
      { l: "B", t: "Criar o branch de correção a partir do <code>main</code> (ou <code>master</code>), usando um branch <code>hotfix/*</code>, e depois fazer merge tanto no <code>main</code> quanto no <code>develop</code>." },
      { l: "C", t: "Criar o branch de correção a partir de um branch <code>release/*</code> existente e aguardar o próximo ciclo de lançamento." },
      { l: "D", t: "Fazer o commit diretamente no branch <code>main</code>, pois é uma correção urgente e não há tempo para criar branches." }
    ],
    correct: ["B"],
    explanation: "No Git Flow, correções urgentes em produção são feitas através de branches <strong><code>hotfix/*</code></strong> criados a partir do <strong><code>main</code></strong> (que representa o código em produção). Após a correção, o merge é feito em <strong>dois lugares</strong>: no <code>main</code> (para corrigir produção imediatamente) e no <code>develop</code> (para garantir que a correção também esteja nas próximas versões). Isso evita que funcionalidades incompletas do <code>develop</code> vão para produção."
  },
  {
    id: 3,
    type: "Múltipla escolha (escolha 2)",
    text: "Uma equipe de startups está debatendo qual modelo adotar. Quais duas características descrevem corretamente o GitHub Flow e o diferenciam do Git Flow? (Escolha 2)",
    options: [
      { l: "A", t: "No GitHub Flow, qualquer alteração vai diretamente ao branch <code>main</code> via Pull Request — não há branch intermediário como o <code>develop</code>." },
      { l: "B", t: "O GitHub Flow exige a criação de branches <code>release/*</code> antes de cada deploy em produção, garantindo mais controle." },
      { l: "C", t: "O GitHub Flow é descrito como um fluxo leve, ideal para times que precisam de entregas rápidas e contínuas." },
      { l: "D", t: "No GitHub Flow, os branches de longa duração como <code>develop</code> e <code>hotfix</code> garantem a estabilidade do código principal." }
    ],
    correct: ["A", "C"],
    explanation: "(A) é correto: no GitHub Flow, as alterações vão <strong>diretamente ao <code>main</code></strong> via Pull Request, sem um branch intermediário como o <code>develop</code> do Git Flow. (C) é correto: o GitHub Flow é classificado como <strong>leve e simples</strong>, ideal para entregas contínuas. (B) é incorreta: branches <code>release/*</code> são do <strong>Git Flow</strong>, não do GitHub Flow. (D) é incorreta: branches de longa duração como <code>develop</code> e <code>hotfix</code> são características do <strong>Git Flow</strong>."
  },
  {
    id: 4,
    type: "Única escolha",
    text: "No Git Flow, após uma funcionalidade ser concluída no branch <code>feature/pagamento-pix</code>, para qual branch ela deve ser mergeada primeiro?",
    options: [
      { l: "A", t: "Diretamente no branch <code>main</code>, para que a funcionalidade fique disponível imediatamente em produção." },
      { l: "B", t: "No branch <code>release/*</code> correspondente, aguardando o próximo ciclo de lançamento." },
      { l: "C", t: "No branch <code>develop</code>, que centraliza a integração das funcionalidades antes de irem para produção." },
      { l: "D", t: "No branch <code>hotfix/*</code>, para que seja revisada antes de ir ao <code>develop</code>." }
    ],
    correct: ["C"],
    explanation: "No Git Flow, branches de <strong><code>feature/*</code></strong> são sempre mergeados no branch <strong><code>develop</code></strong>, que funciona como a área de integração de todas as funcionalidades em desenvolvimento. O <code>develop</code> acumula as features prontas e, quando o time decide fazer uma release, cria-se um branch <code>release/*</code> a partir do <code>develop</code> para estabilização. Somente então o código chega ao <code>main</code>. Features nunca vão diretamente ao <code>main</code> no Git Flow."
  },
  {
    id: 5,
    type: "Única escolha",
    text: "Um gerente técnico apresentou a seguinte afirmação para sua equipe: 'No GitHub Flow, após o merge de um Pull Request no <code>main</code>, o branch de feature deve ser mantido aberto por pelo menos uma semana para monitorar possíveis problemas em produção.' Essa afirmação está correta?",
    options: [
      { l: "A", t: "Sim — manter o branch aberto é uma boa prática do GitHub Flow para garantir rollback rápido em caso de problemas." },
      { l: "B", t: "Não — o GitHub Flow recomenda deletar o branch imediatamente após o merge, pois o histórico do PR e dos commits é preservado independentemente." },
      { l: "C", t: "Sim — o GitHub Flow exige um período de observação de 7 dias antes de permitir a deleção do branch." },
      { l: "D", t: "Não — no GitHub Flow não é possível deletar branches após o merge, pois eles são necessários para rastreabilidade futura." }
    ],
    correct: ["B"],
    explanation: "A afirmação está <strong>incorreta</strong>. O GitHub Flow recomenda <strong>deletar o branch imediatamente após o merge</strong>, sem período de espera. Isso indica que o trabalho foi concluído e evita confusão com branches desatualizados. A preocupação com rastreabilidade é desnecessária: o <strong>histórico completo do Pull Request — incluindo todos os commits e comentários — é preservado no GitHub</strong> mesmo após a deleção do branch. Para rollback, usa-se o histórico do <code>main</code> ou ferramentas como <code>git revert</code>."
  }
];

let answered = 0, score = 0, multiSel = {};

function buildUI() {
  document.getElementById('quiz').innerHTML = questions.map(q => {
    const isMulti = q.correct.length > 1;
    let html = isMulti ? `<div class="multi-hint">⚠ Selecione ${q.correct.length} opções e confirme</div>` : '';
    html += `<div class="options" id="opts${q.id}">`;
    q.options.forEach(o => {
      html += `<div class="opt" id="opt${q.id}${o.l}" onclick="pick(${q.id},'${o.l}',${isMulti})">
        <div class="opt-bubble" id="bbl${q.id}${o.l}"></div>
        <div class="opt-letter">${o.l}</div>
        <div class="opt-text">${o.t}</div>
      </div>`;
    });
    html += '</div>';
    if (isMulti) html += `<button class="confirm-btn" id="cbtn${q.id}" onclick="submitMulti(${q.id})" disabled>Confirmar resposta</button>`;
    html += `<div class="feedback" id="fb${q.id}"></div>`;
    return `<div class="qcard" id="card${q.id}">
      <div class="qcard-header">
        <div class="qnum">0${q.id}</div>
        <div class="qmeta">
          <div class="qtype">${q.type}</div>
          <div class="qtext">${q.text}</div>
        </div>
      </div>
      ${html}
    </div>`;
  }).join('');
}

function pick(qid, label, isMulti) {
  const all = document.querySelectorAll(`[id^="opt${qid}"]`);
  if ([...all].some(o => o.classList.contains('disabled'))) return;
  if (!isMulti) { all.forEach(o => o.classList.add('disabled')); evalSingle(qid, label); }
  else {
    if (!multiSel[qid]) multiSel[qid] = new Set();
    const sel = multiSel[qid];
    const el = document.getElementById(`opt${qid}${label}`);
    const bbl = document.getElementById(`bbl${qid}${label}`);
    if (sel.has(label)) { sel.delete(label); el.classList.remove('sel-multi'); bbl.textContent = ''; }
    else { sel.add(label); el.classList.add('sel-multi'); bbl.textContent = '✓'; }
    const q = questions.find(x => x.id === qid);
    document.getElementById(`cbtn${qid}`).disabled = sel.size !== q.correct.length;
  }
}

function submitMulti(qid) {
  const q = questions.find(x => x.id === qid);
  document.querySelectorAll(`[id^="opt${qid}"]`).forEach(o => o.classList.add('disabled'));
  document.getElementById(`cbtn${qid}`).style.display = 'none';
  const chosen = multiSel[qid] || new Set();
  const isOk = q.correct.every(c => chosen.has(c)) && chosen.size === q.correct.length;
  q.options.forEach(o => {
    const el = document.getElementById(`opt${qid}${o.l}`);
    const bbl = document.getElementById(`bbl${qid}${o.l}`);
    el.classList.remove('sel-multi');
    if (q.correct.includes(o.l) && chosen.has(o.l)) { el.classList.add('correct'); bbl.textContent = '✓'; }
    else if (!q.correct.includes(o.l) && chosen.has(o.l)) { el.classList.add('wrong'); bbl.textContent = '✕'; }
    else if (q.correct.includes(o.l) && !chosen.has(o.l)) { el.classList.add('missed'); bbl.textContent = '!'; }
  });
  showFb(qid, isOk, q.explanation); tally(isOk);
}

function evalSingle(qid, chosen) {
  const q = questions.find(x => x.id === qid);
  const isOk = q.correct.includes(chosen);
  q.options.forEach(o => {
    const el = document.getElementById(`opt${qid}${o.l}`);
    const bbl = document.getElementById(`bbl${qid}${o.l}`);
    if (q.correct.includes(o.l)) { el.classList.add('correct'); bbl.textContent = '✓'; }
    else if (o.l === chosen) { el.classList.add('wrong'); bbl.textContent = '✕'; }
  });
  showFb(qid, isOk, q.explanation); tally(isOk);
}

function showFb(qid, isOk, explanation) {
  const fb = document.getElementById(`fb${qid}`);
  fb.className = `feedback ${isOk ? 'fb-ok' : 'fb-err'}`;
  fb.innerHTML = `<div class="fb-label">${isOk ? '✓ &nbsp; Correto' : '✕ &nbsp; Incorreto'}</div><div class="fb-body">${explanation}</div>`;
}

function tally(isOk) {
  answered++; if (isOk) score++;
  document.getElementById('progressFill').style.width = (answered / questions.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `${answered} de ${questions.length} respondidas`;
  document.getElementById('scoreLive').textContent = score;
  if (answered === questions.length) setTimeout(showResult, 900);
}

function showResult() {
  const pct = Math.round(score / questions.length * 100);
  const pass = pct >= 70;
  const panel = document.getElementById('result');
  panel.classList.add('show');
  panel.innerHTML = `
    <div class="result-ring ${pass ? 'pass' : 'fail'}">${pct}%</div>
    <div class="result-title">${pass ? 'APROVADO' : 'CONTINUE ESTUDANDO'}</div>
    <div class="result-sub">${pass ? 'Acima do mínimo exigido de 70% na GH-900' : 'Mínimo exigido na GH-900: 70%'}</div>
    <div class="result-stats">
      <div class="stat ok"><div class="stat-n">${score}</div><div class="stat-l">Corretas</div></div>
      <div class="stat err"><div class="stat-n">${questions.length - score}</div><div class="stat-l">Incorretas</div></div>
      <div class="stat pct"><div class="stat-n">${pct}%</div><div class="stat-l">Aproveitamento</div></div>
    </div>
    <button class="restart-btn" onclick="restart()">↺ &nbsp; Refazer simulado</button>
  `;
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function restart() {
  answered = 0; score = 0; multiSel = {};
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressLabel').textContent = '0 de 5 respondidas';
  document.getElementById('scoreLive').textContent = '0';
  const panel = document.getElementById('result');
  panel.classList.remove('show'); panel.innerHTML = '';
  buildUI(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildUI();
</script>
</body>
</html>

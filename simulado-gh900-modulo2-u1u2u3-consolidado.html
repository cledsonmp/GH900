<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado GH-900 — Módulo 2 · U1+U2+U3 · 10 Questões</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #08080f;
    --surface: #0f0f1a;
    --surface2: #151525;
    --border: #222238;
    --accent: #a78bfa;
    --accent-dim: rgba(167,139,250,0.12);
    --accent2: #f472b6;
    --accent3: #34d399;
    --accent4: #60a5fa;
    --text: #ededf5;
    --text-muted: #5a5a80;
    --correct-bg: #0a2218;
    --correct-border: #34d399;
    --wrong-bg: #220a0a;
    --wrong-border: #f87171;
    --missed-border: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; padding: 48px 20px 100px;
    position: relative; overflow-x: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(167,139,250,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 0% 100%, rgba(52,211,153,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 100% 60%, rgba(244,114,182,0.03) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  body::after {
    content: ''; position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(167,139,250,0.02) 59px, rgba(167,139,250,0.02) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(167,139,250,0.02) 59px, rgba(167,139,250,0.02) 60px);
    pointer-events: none; z-index: 0;
  }

  .container { max-width: 880px; margin: 0 auto; position: relative; z-index: 1; }

  /* HEADER */
  .header { margin-bottom: 60px; animation: slideDown 0.7s cubic-bezier(.16,1,.3,1) both; }

  .eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 11px; border-radius: 3px; border: 1px solid; }
  .t1 { color: var(--accent); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
  .t2 { color: var(--accent2); border-color: rgba(244,114,182,0.4); background: rgba(244,114,182,0.07); }
  .t3 { color: var(--accent3); border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.07); }
  .t4 { color: var(--accent4); border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.07); }

  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 2s ease-in-out infinite; margin-left: auto; }

  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(56px, 10vw, 96px); line-height: 0.88; letter-spacing: 0.02em; }
  h1 .l1 { color: var(--accent); text-shadow: 0 0 50px rgba(167,139,250,0.3); }
  h1 .l2 { color: var(--accent2); }
  h1 .l3 { color: var(--accent3); }

  .subtitle { margin-top: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em; }

  /* UNIT LEGEND */
  .legend {
    display: flex; gap: 20px; margin-top: 24px; flex-wrap: wrap;
    padding: 16px 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .ld1 { background: var(--accent); }
  .ld2 { background: var(--accent2); }
  .ld3 { background: var(--accent3); }

  /* PROGRESS */
  .progress-wrap { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .progress-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); background-size: 200% 100%; width: 0%; transition: width 0.6s cubic-bezier(.16,1,.3,1); border-radius: 2px; box-shadow: 0 0 10px rgba(167,139,250,0.4); animation: shimmer 3s linear infinite; }
  .progress-meta { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-muted); }
  .score-live { color: var(--accent3); font-weight: 700; }

  /* CARD */
  .qcard {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px; margin-bottom: 24px;
    opacity: 0; transform: translateY(20px);
    animation: riseUp 0.45s cubic-bezier(.16,1,.3,1) forwards;
    position: relative; overflow: hidden; transition: border-color 0.3s;
  }

  .qcard:nth-child(1)  { animation-delay: 0.03s; }
  .qcard:nth-child(2)  { animation-delay: 0.07s; }
  .qcard:nth-child(3)  { animation-delay: 0.11s; }
  .qcard:nth-child(4)  { animation-delay: 0.15s; }
  .qcard:nth-child(5)  { animation-delay: 0.19s; }
  .qcard:nth-child(6)  { animation-delay: 0.23s; }
  .qcard:nth-child(7)  { animation-delay: 0.27s; }
  .qcard:nth-child(8)  { animation-delay: 0.31s; }
  .qcard:nth-child(9)  { animation-delay: 0.35s; }
  .qcard:nth-child(10) { animation-delay: 0.39s; }

  .qcard.unit-1 { border-left: 3px solid rgba(167,139,250,0.5); }
  .qcard.unit-2 { border-left: 3px solid rgba(244,114,182,0.5); }
  .qcard.unit-3 { border-left: 3px solid rgba(52,211,153,0.5); }

  .qcard.unit-1:hover { border-color: rgba(167,139,250,0.3); }
  .qcard.unit-2:hover { border-color: rgba(244,114,182,0.3); }
  .qcard.unit-3:hover { border-color: rgba(52,211,153,0.3); }

  .qcard-header { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 26px; }

  .qnum-wrap { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .qnum { font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1; color: var(--border); letter-spacing: 0.02em; transition: color 0.3s; }
  .qcard:hover .qnum { color: rgba(167,139,250,0.2); }

  .unit-pip { width: 8px; height: 8px; border-radius: 50%; }
  .unit-1 .unit-pip { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .unit-2 .unit-pip { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .unit-3 .unit-pip { background: var(--accent3); box-shadow: 0 0 6px var(--accent3); }

  .qmeta { flex: 1; }
  .qtype { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .unit-1 .qtype { color: var(--accent); }
  .unit-2 .qtype { color: var(--accent2); }
  .unit-3 .qtype { color: var(--accent3); }
  .qtype::before { content: ''; display: inline-block; width: 14px; height: 1px; }
  .unit-1 .qtype::before { background: var(--accent); }
  .unit-2 .qtype::before { background: var(--accent2); }
  .unit-3 .qtype::before { background: var(--accent3); }

  .qtext { font-size: 15.5px; font-weight: 500; line-height: 1.62; color: var(--text); }

  /* OPTIONS */
  .multi-hint { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--missed-border); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .options { display: flex; flex-direction: column; gap: 9px; }

  .opt {
    display: flex; align-items: flex-start; gap: 13px;
    padding: 14px 18px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 9px;
    cursor: pointer; transition: all 0.18s ease; user-select: none;
  }

  .unit-1 .opt:hover:not(.disabled) { border-color: var(--accent); background: rgba(167,139,250,0.06); transform: translateX(4px); }
  .unit-2 .opt:hover:not(.disabled) { border-color: var(--accent2); background: rgba(244,114,182,0.05); transform: translateX(4px); }
  .unit-3 .opt:hover:not(.disabled) { border-color: var(--accent3); background: rgba(52,211,153,0.05); transform: translateX(4px); }

  .opt.disabled { cursor: default; }
  .opt.disabled:hover { transform: none; }
  .opt.correct { background: var(--correct-bg); border-color: var(--correct-border); }
  .opt.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
  .opt.missed { background: rgba(251,191,36,0.05); border-color: var(--missed-border); }

  .unit-1 .opt.sel-multi:not(.disabled) { border-color: var(--accent); background: rgba(167,139,250,0.08); }
  .unit-2 .opt.sel-multi:not(.disabled) { border-color: var(--accent2); background: rgba(244,114,182,0.07); }
  .unit-3 .opt.sel-multi:not(.disabled) { border-color: var(--accent3); background: rgba(52,211,153,0.07); }

  .opt-bubble { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--text-muted); transition: all 0.18s; margin-top: 1px; }
  .opt.correct .opt-bubble { background: var(--correct-border); border-color: var(--correct-border); color: #08080f; }
  .opt.wrong .opt-bubble { background: var(--wrong-border); border-color: var(--wrong-border); color: #fff; }
  .opt.missed .opt-bubble { background: var(--missed-border); border-color: var(--missed-border); color: #08080f; }
  .unit-1 .opt.sel-multi:not(.disabled) .opt-bubble { background: var(--accent); border-color: var(--accent); color: #08080f; }
  .unit-2 .opt.sel-multi:not(.disabled) .opt-bubble { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .unit-3 .opt.sel-multi:not(.disabled) .opt-bubble { background: var(--accent3); border-color: var(--accent3); color: #08080f; }

  .opt-letter { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; margin-top: 2px; }
  .opt-text { font-size: 14px; line-height: 1.5; color: var(--text); }

  code { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.2); border-radius: 4px; padding: 1px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #c4b5fd; }

  .confirm-btn { margin-top: 16px; padding: 12px 26px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 0.02em; }
  .unit-1 .confirm-btn { background: var(--accent); color: #08080f; }
  .unit-2 .confirm-btn { background: var(--accent2); color: #fff; }
  .unit-3 .confirm-btn { background: var(--accent3); color: #08080f; }
  .confirm-btn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 4px 18px rgba(0,0,0,0.3); }
  .confirm-btn:disabled { opacity: 0.2; cursor: default; transform: none; filter: none; box-shadow: none; }

  /* FEEDBACK */
  .feedback { display: none; margin-top: 18px; padding: 18px; border-radius: 10px; font-size: 14px; line-height: 1.65; animation: riseUp 0.3s cubic-bezier(.16,1,.3,1) both; }
  .feedback.fb-ok { display: block; background: var(--correct-bg); border: 1px solid rgba(52,211,153,0.25); }
  .feedback.fb-err { display: block; background: var(--wrong-bg); border: 1px solid rgba(248,113,113,0.25); }
  .fb-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .fb-ok .fb-label { color: var(--correct-border); }
  .fb-err .fb-label { color: var(--wrong-border); }
  .fb-body { color: var(--text); }

  /* RESULT */
  .result-panel { display: none; margin-top: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 60px 40px; text-align: center; animation: riseUp 0.7s cubic-bezier(.16,1,.3,1) both; position: relative; overflow: hidden; }
  .result-panel::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(167,139,250,0.07), transparent); pointer-events: none; }
  .result-panel.show { display: block; }

  .result-ring { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 28px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 46px; letter-spacing: 0.04em; position: relative; }
  .result-ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid; }
  .result-ring.pass { color: var(--correct-border); background: rgba(52,211,153,0.07); }
  .result-ring.pass::after { border-color: var(--correct-border); box-shadow: 0 0 40px rgba(52,211,153,0.15); }
  .result-ring.fail { color: var(--wrong-border); background: rgba(248,113,113,0.07); }
  .result-ring.fail::after { border-color: var(--wrong-border); }

  .result-title { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 0.05em; margin-bottom: 8px; }
  .result-sub { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); margin-bottom: 44px; letter-spacing: 0.04em; }

  .result-stats { display: flex; justify-content: center; gap: 52px; flex-wrap: wrap; margin-bottom: 44px; }
  .stat { text-align: center; }
  .stat-n { font-family: 'Bebas Neue', sans-serif; font-size: 52px; letter-spacing: 0.04em; line-height: 1; }
  .stat-l { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-top: 6px; }
  .stat.ok .stat-n { color: var(--correct-border); }
  .stat.err .stat-n { color: var(--wrong-border); }
  .stat.pct .stat-n { color: var(--accent); }

  .unit-breakdown { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
  .unit-score { text-align: center; padding: 16px 24px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; min-width: 100px; }
  .unit-score-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .unit-score-val { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 0.04em; }
  .us1 .unit-score-val { color: var(--accent); }
  .us2 .unit-score-val { color: var(--accent2); }
  .us3 .unit-score-val { color: var(--accent3); }

  .restart-btn { padding: 14px 40px; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .restart-btn:hover { background: var(--accent-dim); box-shadow: 0 0 24px rgba(167,139,250,0.2); }

  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes riseUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
  @keyframes shimmer { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }

  @media (max-width: 600px) { .qcard { padding: 20px; } .qnum { font-size: 36px; } .result-stats { gap: 24px; } .result-panel { padding: 36px 16px; } .unit-breakdown { gap: 12px; } }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="eyebrow">
      <span class="tag t1">U1 · Introdução</span>
      <span class="tag t2">U2 · O que é o GitHub</span>
      <span class="tag t3">U3 · GitHub Flow</span>
      <span class="tag t4">10 questões</span>
      <span class="live-dot"></span>
    </div>
    <h1>
      <span class="l1">Módulo</span><br>
      <span class="l2">2 —</span><br>
      <span class="l3">Completo</span>
    </h1>
    <p class="subtitle">// unidades 1, 2 e 3 · simulado consolidado · nível prova GH-900</p>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot ld1"></div>Unidade 1 — Introdução</div>
      <div class="legend-item"><div class="legend-dot ld2"></div>Unidade 2 — O que é o GitHub</div>
      <div class="legend-item"><div class="legend-dot ld3"></div>Unidade 3 — GitHub Flow</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span id="progressLabel">0 de 10 respondidas</span>
        <span>Acertos: <span class="score-live" id="scoreLive">0</span></span>
      </div>
    </div>
  </header>

  <div id="quiz"></div>
  <div class="result-panel" id="result"></div>

</div>
<script>
const questions = [
  // ── UNIDADE 1 ──────────────────────────────────────────────────────
  {
    id: 1, unit: 1,
    type: "Única escolha · Unidade 1",
    text: "A Plataforma GitHub Enterprise é sustentada por cinco pilares estratégicos. Um gestor de TI pergunta qual pilar garante que desenvolvedores possam colaborar em repositórios, abrir pull requests e gerenciar issues de forma integrada. Qual é a resposta correta?",
    options: [
      { l: "A", t: "IA — pois o Copilot auxilia a colaboração sugerindo código entre desenvolvedores." },
      { l: "B", t: "Colaboração — pois engloba as ferramentas que permitem trabalho em equipe, como repositórios, issues e pull requests." },
      { l: "C", t: "Produtividade — pois automatiza o processo de colaboração através de pipelines CI/CD." },
      { l: "D", t: "Segurança — pois garante que apenas pessoas autorizadas colaborem nos repositórios." }
    ],
    correct: ["B"],
    explanation: "O pilar de <strong>Colaboração</strong> é responsável pelas ferramentas de trabalho em equipe da plataforma: repositórios, issues, pull requests, discussões e wikis. Já o pilar de <strong>IA</strong> cobre o Copilot, <strong>Produtividade</strong> cobre automação CI/CD e <strong>Segurança</strong> cobre CodeQL, Dependabot e varredura de segredos."
  },
  {
    id: 2, unit: 1,
    type: "Única escolha · Unidade 1",
    text: "Qual dos cinco pilares da Plataforma GitHub Enterprise representa o conjunto de ferramentas voltadas à automação de tarefas repetitivas, como pipelines de CI/CD e execução de fluxos de trabalho?",
    options: [
      { l: "A", t: "Colaboração" },
      { l: "B", t: "IA" },
      { l: "C", t: "Produtividade" },
      { l: "D", t: "Escala" }
    ],
    correct: ["C"],
    explanation: "O pilar de <strong>Produtividade</strong> foca em automatizar tarefas repetitivas do ciclo de desenvolvimento, incluindo pipelines de integração e entrega contínua (CI/CD) com GitHub Actions. O pilar de <strong>IA</strong> cobre o Copilot e seus agentes. <strong>Colaboração</strong> cobre o trabalho em equipe. <strong>Escala</strong> representa o alcance global da plataforma."
  },

  // ── UNIDADE 2 ──────────────────────────────────────────────────────
  {
    id: 3, unit: 2,
    type: "Única escolha · Unidade 2",
    text: "Um desenvolvedor quer criar um repositório no GitHub para um projeto open source que qualquer pessoa possa ver e contribuir. Ao mesmo tempo, ele quer criar outro repositório para um projeto comercial que só sua equipe deve acessar. Quais configurações de visibilidade ele deve escolher, respectivamente?",
    options: [
      { l: "A", t: "Privado para o open source; Público para o comercial." },
      { l: "B", t: "Público para o open source; Privado para o comercial." },
      { l: "C", t: "Público para ambos — repositórios privados não permitem contribuições externas." },
      { l: "D", t: "Secreto para o open source; Restrito para o comercial." }
    ],
    correct: ["B"],
    explanation: "Repositórios <strong>públicos</strong> são visíveis para qualquer pessoa na internet — ideal para projetos open source que aceitam contribuições externas. Repositórios <strong>privados</strong> têm acesso controlado, visível apenas para o criador e pessoas explicitamente autorizadas — ideal para projetos comerciais ou internos. Não existem configurações 'Secreto' ou 'Restrito' nas opções padrão de repositório do GitHub."
  },
  {
    id: 4, unit: 2,
    type: "Múltipla escolha (escolha 2) · Unidade 2",
    text: "Um desenvolvedor quer usar Gists para compartilhar alguns trechos de código com colegas. Quais duas afirmações descrevem corretamente o comportamento dos Gists no GitHub? (Escolha 2)",
    options: [
      { l: "A", t: "Gists públicos podem ser encontrados por qualquer pessoa através da busca no GitHub." },
      { l: "B", t: "Gists secretos são completamente privados — nem mesmo quem tem a URL consegue acessá-los sem autenticação." },
      { l: "C", t: "Gists são mini-repositórios ideais para compartilhar snippets de código sem criar um repositório completo." },
      { l: "D", t: "Gists secretos têm as mesmas permissões de acesso que repositórios privados — só o criador pode ver." }
    ],
    correct: ["A", "C"],
    explanation: "(A) é correto: Gists <strong>públicos</strong> são indexados e aparecem nos resultados de busca do GitHub. (C) é correto: Gists são exatamente <strong>mini-repositórios leves</strong> para snippets, anotações e configurações, sem a necessidade de criar um repositório completo. (B) é incorreta: Gists secretos <strong>não são privados</strong> — qualquer pessoa com a URL pode acessá-los. (D) é incorreta pelo mesmo motivo — Gists secretos e repositórios privados têm comportamentos completamente diferentes."
  },
  {
    id: 5, unit: 2,
    type: "Única escolha · Unidade 2",
    text: "Uma equipe de desenvolvimento mantém um repositório privado no GitHub e quer documentar guias de arquitetura, tutoriais e padrões de código em um espaço vinculado ao repositório. Qual recurso do GitHub é mais adequado para essa finalidade?",
    options: [
      { l: "A", t: "GitHub Pages — para publicar a documentação como um site estático acessível publicamente." },
      { l: "B", t: "Wiki do repositório — seção dedicada para documentação longa e detalhada, com acesso controlado pela visibilidade do repositório." },
      { l: "C", t: "Gist secreto — para manter a documentação acessível apenas para quem tiver o link." },
      { l: "D", t: "README.md — arquivo de descrição rápida que comporta toda a documentação técnica necessária." }
    ],
    correct: ["B"],
    explanation: "A <strong>Wiki do repositório</strong> é o recurso ideal para documentação longa e estruturada — guias de arquitetura, tutoriais, padrões. Em repositórios <strong>privados</strong>, a Wiki segue a mesma regra de acesso: apenas quem tem permissão de leitura no repositório consegue visualizá-la. O README.md é para descrições resumidas. GitHub Pages publica sites públicos. Gists não são adequados para documentação estruturada de projetos."
  },

  // ── UNIDADE 3 ──────────────────────────────────────────────────────
  {
    id: 6, unit: 3,
    type: "Única escolha · Unidade 3",
    text: "Observe a sequência abaixo e identifique qual etapa está FORA da ordem correta do GitHub Flow:\n\n① Criar branch → ② Abrir Pull Request → ③ Fazer commits → ④ Revisar feedback → ⑤ Merge → ⑥ Deletar branch",
    options: [
      { l: "A", t: "A etapa ① está fora de ordem — o Pull Request deve ser aberto antes de criar o branch." },
      { l: "B", t: "A etapa ② está fora de ordem — o Pull Request deve ser aberto após os commits, não antes deles." },
      { l: "C", t: "A etapa ⑥ está fora de ordem — o branch deve ser deletado antes do merge." },
      { l: "D", t: "A etapa ④ está fora de ordem — o feedback é coletado antes de abrir o Pull Request." }
    ],
    correct: ["B"],
    explanation: "A ordem correta do GitHub Flow é: <strong>① Branch → ② Commits → ③ Pull Request → ④ Revisar feedback → ⑤ Merge → ⑥ Deletar branch</strong>. Na sequência apresentada, o Pull Request (②) foi colocado antes dos commits (③), o que está errado — você precisa ter commits no branch para poder abrir um Pull Request significativo."
  },
  {
    id: 7, unit: 3,
    type: "Única escolha · Unidade 3",
    text: "Um desenvolvedor criou um arquivo novo chamado <code>config.json</code> e em seguida executou <code>git add config.json</code>. Qual é o estado atual desse arquivo?",
    options: [
      { l: "A", t: "Untracked — o arquivo existe na pasta mas o Git ainda não o reconhece." },
      { l: "B", t: "Modified — o arquivo foi alterado e está aguardando ser adicionado ao staging." },
      { l: "C", t: "Staged — o arquivo foi preparado e está pronto para ser incluído no próximo commit." },
      { l: "D", t: "Committed — o <code>git add</code> salva automaticamente o arquivo no histórico do repositório." }
    ],
    correct: ["C"],
    explanation: "Após executar <code>git add</code>, o arquivo passa para o estado <strong>Staged (Preparado)</strong> — ele está na área de staging aguardando o próximo <code>git commit</code>. Antes do <code>git add</code>, um arquivo recém-criado estaria como <strong>Untracked</strong>. O estado <strong>Modified</strong> é para arquivos já rastreados que foram alterados. O <code>git add</code> <strong>não salva no histórico</strong> — quem faz isso é o <code>git commit</code>."
  },
  {
    id: 8, unit: 3,
    type: "Única escolha · Unidade 3",
    text: "Um time de desenvolvimento com deploy várias vezes ao dia precisa de um fluxo de trabalho simples, sem branches de longa duração. Qual modelo é o mais adequado e qual é a característica que o diferencia da alternativa?",
    options: [
      { l: "A", t: "Git Flow — porque o branch <code>develop</code> centraliza todas as entregas antes do deploy, garantindo mais controle." },
      { l: "B", t: "GitHub Flow — porque é um fluxo leve onde as alterações vão direto ao <code>main</code> via Pull Request, sem branches intermediários de longa duração." },
      { l: "C", t: "Git Flow — porque os branches de <code>hotfix</code> permitem correções rápidas sem interromper o fluxo de deploys frequentes." },
      { l: "D", t: "GitHub Flow — porque exige a criação obrigatória de branches <code>release</code> antes de cada deploy em produção." }
    ],
    correct: ["B"],
    explanation: "O <strong>GitHub Flow</strong> é ideal para times com entregas contínuas: é leve, simples e as alterações vão diretamente ao <code>main</code> via Pull Request, sem branches intermediários de longa duração. O <strong>Git Flow</strong> é mais 'pesado', com branches como <code>develop</code>, <code>release</code> e <code>hotfix</code> — mais adequado para times com ciclos de lançamento versionados e planejados, não para deploys múltiplos por dia."
  },
  {
    id: 9, unit: 3,
    type: "Múltipla escolha (escolha 2) · Unidade 3",
    text: "Um desenvolvedor abriu um Pull Request no GitHub para revisão da equipe. Quais duas ações são possíveis durante o processo de revisão desse Pull Request? (Escolha 2)",
    options: [
      { l: "A", t: "O desenvolvedor pode fazer novos commits no branch e o Pull Request será atualizado automaticamente." },
      { l: "B", t: "Os revisores podem comentar em linhas específicas do código, além de comentar no Pull Request como um todo." },
      { l: "C", t: "Após abrir o Pull Request, o branch fica bloqueado e nenhum novo commit pode ser adicionado até que o PR seja aprovado." },
      { l: "D", t: "O Pull Request é automaticamente fechado se o desenvolvedor fizer um novo push após a abertura do PR." }
    ],
    correct: ["A", "B"],
    explanation: "(A) é correto: após abrir um PR, o desenvolvedor pode continuar fazendo commits e pushes no branch — o <strong>Pull Request se atualiza automaticamente</strong>. (B) é correto: revisores podem comentar no PR como um todo <strong>ou em linhas e arquivos específicos</strong>, tornando o feedback preciso. (C) é incorreta: o branch <strong>não é bloqueado</strong> após a abertura do PR. (D) é incorreta: novos pushes atualizam o PR, não o fecham."
  },
  {
    id: 10, unit: 3,
    type: "Única escolha · Unidade 3",
    text: "Um desenvolvedor está implementando uma funcionalidade complexa e quer compartilhar o progresso com a equipe para receber orientações, mas o código ainda não está em condições de ser revisado formalmente nem mergeado. Qual é o recurso correto do GitHub Flow para essa situação?",
    options: [
      { l: "A", t: "Abrir um Pull Request normal e adicionar o comentário 'WIP' (Work in Progress) na descrição para avisar a equipe." },
      { l: "B", t: "Criar uma Issue descrevendo o progresso e aguardar que a equipe comente antes de abrir qualquer Pull Request." },
      { l: "C", t: "Abrir um Draft Pull Request, sinalizando que o trabalho está em andamento e que ainda não está pronto para revisão formal ou merge." },
      { l: "D", t: "Fazer push diretamente no branch <code>main</code> com um commit marcado como temporário para que a equipe veja o progresso." }
    ],
    correct: ["C"],
    explanation: "O <strong>Draft Pull Request</strong> (PR Rascunho) é o recurso criado exatamente para esse cenário: permite abrir um PR enquanto o trabalho ainda está em andamento, sinalizando claramente para a equipe que o código <strong>não está pronto para revisão formal nem para merge</strong>. Isso abre o canal de comunicação para feedback antecipado sem o risco de merge prematuro. Quando estiver pronto, o desenvolvedor converte o Draft em PR normal."
  }
];

let answered = 0, score = 0, multiSel = {};
const unitScores = { 1: { correct: 0, total: 0 }, 2: { correct: 0, total: 0 }, 3: { correct: 0, total: 0 } };

function buildUI() {
  document.getElementById('quiz').innerHTML = questions.map(q => {
    const isMulti = q.correct.length > 1;
    let html = isMulti ? `<div class="multi-hint">⚠ Selecione ${q.correct.length} opções e confirme</div>` : '';
    html += `<div class="options" id="opts${q.id}">`;
    q.options.forEach(o => {
      html += `<div class="opt" id="opt${q.id}${o.l}" onclick="pick(${q.id},'${o.l}',${isMulti})">
        <div class="opt-bubble" id="bbl${q.id}${o.l}"></div>
        <div class="opt-letter">${o.l}</div>
        <div class="opt-text">${o.t}</div>
      </div>`;
    });
    html += '</div>';
    if (isMulti) html += `<button class="confirm-btn" id="cbtn${q.id}" onclick="submitMulti(${q.id})" disabled>Confirmar resposta</button>`;
    html += `<div class="feedback" id="fb${q.id}"></div>`;

    return `<div class="qcard unit-${q.unit}" id="card${q.id}">
      <div class="qcard-header">
        <div class="qnum-wrap">
          <div class="qnum">${String(q.id).padStart(2,'0')}</div>
          <div class="unit-pip"></div>
        </div>
        <div class="qmeta">
          <div class="qtype">${q.type}</div>
          <div class="qtext">${q.text}</div>
        </div>
      </div>
      ${html}
    </div>`;
  }).join('');
}

function pick(qid, label, isMulti) {
  const allOpts = document.querySelectorAll(`[id^="opt${qid}"]`);
  if ([...allOpts].some(o => o.classList.contains('disabled'))) return;
  if (!isMulti) {
    allOpts.forEach(o => o.classList.add('disabled'));
    evalSingle(qid, label);
  } else {
    if (!multiSel[qid]) multiSel[qid] = new Set();
    const sel = multiSel[qid];
    const el = document.getElementById(`opt${qid}${label}`);
    const bbl = document.getElementById(`bbl${qid}${label}`);
    if (sel.has(label)) { sel.delete(label); el.classList.remove('sel-multi'); bbl.textContent = ''; }
    else { sel.add(label); el.classList.add('sel-multi'); bbl.textContent = '✓'; }
    const q = questions.find(x => x.id === qid);
    document.getElementById(`cbtn${qid}`).disabled = sel.size !== q.correct.length;
  }
}

function submitMulti(qid) {
  const q = questions.find(x => x.id === qid);
  document.querySelectorAll(`[id^="opt${qid}"]`).forEach(o => o.classList.add('disabled'));
  document.getElementById(`cbtn${qid}`).style.display = 'none';
  const chosen = multiSel[qid] || new Set();
  const isOk = q.correct.every(c => chosen.has(c)) && chosen.size === q.correct.length;
  q.options.forEach(o => {
    const el = document.getElementById(`opt${qid}${o.l}`);
    const bbl = document.getElementById(`bbl${qid}${o.l}`);
    el.classList.remove('sel-multi');
    if (q.correct.includes(o.l) && chosen.has(o.l)) { el.classList.add('correct'); bbl.textContent = '✓'; }
    else if (!q.correct.includes(o.l) && chosen.has(o.l)) { el.classList.add('wrong'); bbl.textContent = '✕'; }
    else if (q.correct.includes(o.l) && !chosen.has(o.l)) { el.classList.add('missed'); bbl.textContent = '!'; }
  });
  showFb(qid, isOk, q.explanation);
  tally(isOk, q.unit);
}

function evalSingle(qid, chosen) {
  const q = questions.find(x => x.id === qid);
  const isOk = q.correct.includes(chosen);
  q.options.forEach(o => {
    const el = document.getElementById(`opt${qid}${o.l}`);
    const bbl = document.getElementById(`bbl${qid}${o.l}`);
    if (q.correct.includes(o.l)) { el.classList.add('correct'); bbl.textContent = '✓'; }
    else if (o.l === chosen) { el.classList.add('wrong'); bbl.textContent = '✕'; }
  });
  showFb(qid, isOk, q.explanation);
  tally(isOk, q.unit);
}

function showFb(qid, isOk, explanation) {
  const fb = document.getElementById(`fb${qid}`);
  fb.className = `feedback ${isOk ? 'fb-ok' : 'fb-err'}`;
  fb.innerHTML = `<div class="fb-label">${isOk ? '✓ &nbsp; Correto' : '✕ &nbsp; Incorreto'}</div><div class="fb-body">${explanation}</div>`;
}

function tally(isOk, unit) {
  answered++;
  unitScores[unit].total++;
  if (isOk) { score++; unitScores[unit].correct++; }
  document.getElementById('progressFill').style.width = (answered / questions.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `${answered} de ${questions.length} respondidas`;
  document.getElementById('scoreLive').textContent = score;
  if (answered === questions.length) setTimeout(showResult, 900);
}

function showResult() {
  const pct = Math.round(score / questions.length * 100);
  const pass = pct >= 70;
  const u1pct = unitScores[1].total ? Math.round(unitScores[1].correct / unitScores[1].total * 100) : 0;
  const u2pct = unitScores[2].total ? Math.round(unitScores[2].correct / unitScores[2].total * 100) : 0;
  const u3pct = unitScores[3].total ? Math.round(unitScores[3].correct / unitScores[3].total * 100) : 0;
  const panel = document.getElementById('result');
  panel.classList.add('show');
  panel.innerHTML = `
    <div class="result-ring ${pass ? 'pass' : 'fail'}">${pct}%</div>
    <div class="result-title">${pass ? 'APROVADO' : 'CONTINUE ESTUDANDO'}</div>
    <div class="result-sub">${pass ? 'Acima do mínimo exigido de 70% na GH-900' : 'Mínimo exigido na GH-900: 70%'}</div>
    <div class="result-stats">
      <div class="stat ok"><div class="stat-n">${score}</div><div class="stat-l">Corretas</div></div>
      <div class="stat err"><div class="stat-n">${questions.length - score}</div><div class="stat-l">Incorretas</div></div>
      <div class="stat pct"><div class="stat-n">${pct}%</div><div class="stat-l">Total</div></div>
    </div>
    <div class="unit-breakdown">
      <div class="unit-score us1"><div class="unit-score-label">Unidade 1</div><div class="unit-score-val">${u1pct}%</div></div>
      <div class="unit-score us2"><div class="unit-score-label">Unidade 2</div><div class="unit-score-val">${u2pct}%</div></div>
      <div class="unit-score us3"><div class="unit-score-label">Unidade 3</div><div class="unit-score-val">${u3pct}%</div></div>
    </div>
    <button class="restart-btn" onclick="restart()">↺ &nbsp; Refazer simulado</button>
  `;
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function restart() {
  answered = 0; score = 0; multiSel = {};
  unitScores[1] = { correct: 0, total: 0 };
  unitScores[2] = { correct: 0, total: 0 };
  unitScores[3] = { correct: 0, total: 0 };
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressLabel').textContent = '0 de 10 respondidas';
  document.getElementById('scoreLive').textContent = '0';
  const panel = document.getElementById('result');
  panel.classList.remove('show'); panel.innerHTML = '';
  buildUI();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildUI();
</script>

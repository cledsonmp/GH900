<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado GH-900 — Módulo 2 · Unidades 1 e 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c6aff;
    --accent-glow: rgba(124,106,255,0.2);
    --accent2: #ff6a9b;
    --accent3: #6affd4;
    --text: #e8e8f0;
    --text-muted: #7070a0;
    --correct-bg: #0d2a1e;
    --correct-border: #2dff9a;
    --wrong-bg: #2a0d0d;
    --wrong-border: #ff4d6a;
    --missed-border: #ffb347;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 48px 20px 100px;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(124,106,255,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 50% 30% at 10% 80%, rgba(106,255,212,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 39px,
      rgba(124,106,255,0.03) 39px,
      rgba(124,106,255,0.03) 40px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 39px,
      rgba(124,106,255,0.03) 39px,
      rgba(124,106,255,0.03) 40px
    );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  .header {
    margin-bottom: 56px;
    animation: slideDown 0.7s cubic-bezier(.16,1,.3,1) both;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 3px;
    border: 1px solid;
  }

  .tag-module { color: var(--accent); border-color: rgba(124,106,255,0.4); background: rgba(124,106,255,0.08); }
  .tag-units { color: var(--accent3); border-color: rgba(106,255,212,0.4); background: rgba(106,255,212,0.06); }

  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    animation: blink 1.8s ease-in-out infinite;
    margin-left: auto;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 9vw, 88px);
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  h1 em {
    font-style: normal;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(124,106,255,0.4);
  }

  .subtitle {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* ── PROGRESS ── */
  .progress-wrap {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.6s cubic-bezier(.16,1,.3,1);
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(124,106,255,0.5);
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .score-live { color: var(--accent3); font-weight: 700; }

  /* ── QUESTION CARD ── */
  .qcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(24px);
    animation: riseUp 0.5s cubic-bezier(.16,1,.3,1) forwards;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .qcard::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .qcard:hover::before { opacity: 1; }
  .qcard:hover { border-color: rgba(124,106,255,0.25); }

  .qcard:nth-child(1) { animation-delay: 0.05s; }
  .qcard:nth-child(2) { animation-delay: 0.12s; }
  .qcard:nth-child(3) { animation-delay: 0.19s; }
  .qcard:nth-child(4) { animation-delay: 0.26s; }
  .qcard:nth-child(5) { animation-delay: 0.33s; }

  .qcard-header {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    margin-bottom: 28px;
  }

  .qnum {
    flex-shrink: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    color: var(--border);
    letter-spacing: 0.02em;
    min-width: 52px;
    transition: color 0.3s;
  }

  .qcard:hover .qnum { color: rgba(124,106,255,0.3); }

  .qmeta { flex: 1; }

  .qtype {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .qtype::before {
    content: '';
    display: inline-block;
    width: 16px; height: 1px;
    background: var(--accent2);
  }

  .qtext {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
  }

  /* ── OPTIONS ── */
  .multi-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--missed-border);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    position: relative;
  }

  .opt:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(124,106,255,0.06);
    transform: translateX(4px);
  }

  .opt.disabled { cursor: default; }
  .opt.disabled:hover { transform: none; }

  .opt.correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    box-shadow: 0 0 16px rgba(45,255,154,0.08);
  }

  .opt.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
  }

  .opt.missed {
    background: rgba(255,179,71,0.06);
    border-color: var(--missed-border);
  }

  .opt.sel-multi:not(.disabled) {
    border-color: var(--accent);
    background: rgba(124,106,255,0.08);
  }

  .opt-bubble {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    transition: all 0.2s;
    margin-top: 1px;
  }

  .opt.correct .opt-bubble { background: var(--correct-border); border-color: var(--correct-border); color: #0a0a0f; }
  .opt.wrong .opt-bubble { background: var(--wrong-border); border-color: var(--wrong-border); color: #fff; }
  .opt.missed .opt-bubble { background: var(--missed-border); border-color: var(--missed-border); color: #0a0a0f; }
  .opt.sel-multi:not(.disabled) .opt-bubble { background: var(--accent); border-color: var(--accent); color: #fff; }

  .opt-letter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    flex-shrink: 0;
    margin-top: 3px;
  }

  .opt-text {
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    font-weight: 400;
  }

  code {
    background: rgba(124,106,255,0.1);
    border: 1px solid rgba(124,106,255,0.2);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: #b8aaff;
  }

  /* ── CONFIRM BTN ── */
  .confirm-btn {
    margin-top: 18px;
    padding: 13px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .confirm-btn:hover:not(:disabled) {
    background: #9585ff;
    box-shadow: 0 4px 20px rgba(124,106,255,0.4);
    transform: translateY(-1px);
  }

  .confirm-btn:disabled { opacity: 0.3; cursor: default; transform: none; box-shadow: none; }

  /* ── FEEDBACK ── */
  .feedback {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.65;
    animation: riseUp 0.35s cubic-bezier(.16,1,.3,1) both;
  }

  .feedback.fb-ok {
    display: block;
    background: var(--correct-bg);
    border: 1px solid rgba(45,255,154,0.25);
  }

  .feedback.fb-err {
    display: block;
    background: var(--wrong-bg);
    border: 1px solid rgba(255,77,106,0.25);
  }

  .fb-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .fb-ok .fb-label { color: var(--correct-border); }
  .fb-err .fb-label { color: var(--wrong-border); }

  .fb-body { color: var(--text); }

  /* ── RESULT ── */
  .result-panel {
    display: none;
    margin-top: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 56px 40px;
    text-align: center;
    animation: riseUp 0.7s cubic-bezier(.16,1,.3,1) both;
    position: relative;
    overflow: hidden;
  }

  .result-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(124,106,255,0.07), transparent);
    pointer-events: none;
  }

  .result-panel.show { display: block; }

  .result-ring {
    width: 130px; height: 130px;
    border-radius: 50%;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 0.04em;
    position: relative;
  }

  .result-ring::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid;
  }

  .result-ring.pass { color: var(--correct-border); background: rgba(45,255,154,0.06); }
  .result-ring.pass::after { border-color: var(--correct-border); box-shadow: 0 0 30px rgba(45,255,154,0.15); }
  .result-ring.fail { color: var(--wrong-border); background: rgba(255,77,106,0.06); }
  .result-ring.fail::after { border-color: var(--wrong-border); }

  .result-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .result-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 40px;
    letter-spacing: 0.04em;
  }

  .result-stats {
    display: flex;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .stat { text-align: center; }
  .stat-n {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .stat-l {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .stat.ok .stat-n { color: var(--correct-border); }
  .stat.err .stat-n { color: var(--wrong-border); }
  .stat.pct .stat-n { color: var(--accent); }

  .restart-btn {
    padding: 14px 36px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .restart-btn:hover {
    background: var(--accent-glow);
    box-shadow: 0 0 20px rgba(124,106,255,0.2);
  }

  /* Animations */
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes riseUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  @media (max-width: 600px) {
    .qcard { padding: 22px; }
    .qnum { font-size: 36px; min-width: 38px; }
    .result-stats { gap: 24px; }
    .result-panel { padding: 36px 20px; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="eyebrow">
      <span class="tag tag-module">GH-900 · Módulo 2</span>
      <span class="tag tag-units">Unidades 1 e 2</span>
      <span class="live-dot"></span>
    </div>
    <h1>O que é o<br><em>GitHub?</em></h1>
    <p class="subtitle">// 5 questões · baseado no Microsoft Learn · nível prova</p>

    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-meta">
        <span id="progressLabel">0 de 5 respondidas</span>
        <span>Acertos: <span class="score-live" id="scoreLive">0</span></span>
      </div>
    </div>
  </header>

  <div id="quiz"></div>
  <div class="result-panel" id="result"></div>

</div>
<script>
const questions = [
  {
    id: 1,
    type: "Única escolha",
    text: "Uma empresa está avaliando o GitHub Enterprise para sua equipe de desenvolvimento. Qual dos pilares da Plataforma GitHub Enterprise é responsável por integrar ferramentas como CodeQL, Dependabot e verificação de segredos diretamente no processo de desenvolvimento?",
    options: [
      { l: "A", t: "Colaboração — pois essas ferramentas facilitam o trabalho em equipe entre desenvolvedores." },
      { l: "B", t: "Produtividade — porque automatizam tarefas repetitivas no ciclo de desenvolvimento." },
      { l: "C", t: "Segurança — pois integra proteções nativas ao processo de desenvolvimento desde o início." },
      { l: "D", t: "Escala — pois essas ferramentas são necessárias apenas em grandes organizações com muitos repositórios." }
    ],
    correct: ["C"],
    explanation: "O pilar de <strong>Segurança</strong> da Plataforma GitHub Enterprise é responsável por integrar a segurança diretamente ao processo de desenvolvimento. Ele inclui ferramentas nativas como <strong>CodeQL</strong> (análise de código), <strong>verificação de segredos</strong>, <strong>Dependabot</strong> e visão geral de segurança, garantindo que o código permaneça protegido sem precisar sair da plataforma."
  },
  {
    id: 2,
    type: "Única escolha",
    text: "Um desenvolvedor precisa compartilhar rapidamente um script de configuração com um colega, sem a necessidade de criar um repositório completo. O script não contém dados sensíveis e pode ser visto por qualquer pessoa. Qual recurso do GitHub é mais adequado para essa situação?",
    options: [
      { l: "A", t: "Criar um repositório privado e adicionar o colega como colaborador." },
      { l: "B", t: "Usar um Gist público, que permite compartilhar snippets de código de forma leve e conveniente." },
      { l: "C", t: "Criar uma Wiki no repositório principal e adicionar o script lá." },
      { l: "D", t: "Abrir uma Discussion na categoria Mostrar e contar e colar o script no corpo da mensagem." }
    ],
    correct: ["B"],
    explanation: "Os <strong>Gists</strong> são mini-repositórios do GitHub ideais para compartilhar snippets de código, arquivos de configuração e pequenas informações de forma leve, sem precisar criar um repositório completo. Um Gist <strong>público</strong> é visível para todos e pode ser encontrado por busca — perfeito para o cenário descrito. Repositórios privados exigem mais configuração e Wikis são para documentação de projetos existentes."
  },
  {
    id: 3,
    type: "Múltipla escolha (escolha 2)",
    text: "Uma equipe de segurança está revisando as diretrizes de uso do GitHub na empresa. Quais duas afirmações descrevem corretamente o comportamento e as limitações dos Gists secretos no GitHub? (Escolha 2)",
    options: [
      { l: "A", t: "Gists secretos não aparecem em resultados de busca pública do GitHub." },
      { l: "B", t: "Gists secretos são completamente privados — apenas o criador pode acessá-los, mesmo sem autenticação." },
      { l: "C", t: "Qualquer pessoa que possua a URL de um Gist secreto consegue acessar seu conteúdo." },
      { l: "D", t: "Gists secretos podem armazenar com segurança senhas e chaves de API, pois não são indexados publicamente." }
    ],
    correct: ["A", "C"],
    explanation: "Sobre Gists secretos: (A) é correto — eles <strong>não aparecem em resultados de busca</strong> do GitHub nem são listados publicamente. (C) é correto — apesar de não serem públicos, <strong>qualquer pessoa com a URL pode acessá-los</strong>, portanto não são verdadeiramente privados. (B) é incorreta: eles não são exclusivos do criador. (D) é perigosamente incorreta: o GitHub alerta explicitamente para <strong>nunca armazenar dados sensíveis em gists</strong>, mesmo secretos."
  },
  {
    id: 4,
    type: "Única escolha",
    text: "Um gerente de projeto quer usar o GitHub para hospedar a documentação detalhada de um sistema — incluindo guias de uso, arquitetura e princípios do projeto — vinculada diretamente ao repositório principal. Qual recurso do GitHub foi projetado especificamente para esse propósito?",
    options: [
      { l: "A", t: "GitHub Pages — serviço de hospedagem de sites estáticos integrado ao repositório." },
      { l: "B", t: "GitHub Gists — para compartilhar pequenas informações e snippets de forma leve." },
      { l: "C", t: "Wiki do repositório — seção dedicada para hospedar documentação longa diretamente no repositório." },
      { l: "D", t: "README.md — arquivo que descreve o projeto de forma resumida na página principal do repositório." }
    ],
    correct: ["C"],
    explanation: "A <strong>Wiki do repositório</strong> é a seção dedicada para hospedar documentação longa e detalhada sobre o projeto — como guias de uso, design e princípios. O <strong>README.md</strong> é para descrições rápidas e resumidas (página principal do repo). O <strong>GitHub Pages</strong> hospeda sites estáticos públicos. Os <strong>Gists</strong> são para snippets pequenos. Para documentação estruturada e extensa vinculada ao repositório, a Wiki é a escolha correta."
  },
  {
    id: 5,
    type: "Única escolha",
    text: "Uma organização deseja criar um novo repositório no GitHub que seja visível somente para membros internos autorizados, impedindo acesso externo ao código. Qual configuração de visibilidade ela deve escolher ao criar o repositório?",
    options: [
      { l: "A", t: "Público — para que todos os membros da organização possam visualizar automaticamente." },
      { l: "B", t: "Privado — acessível apenas pelo criador e por pessoas com acesso explicitamente concedido ou membros com permissão na organização." },
      { l: "C", t: "Secreto — configuração especial que oculta o repositório de todos, inclusive dos membros da organização." },
      { l: "D", t: "Restrito — visível somente dentro da rede corporativa da organização." }
    ],
    correct: ["B"],
    explanation: "Repositórios <strong>privados</strong> são acessíveis somente pelo criador, por pessoas com acesso explicitamente concedido e, no caso de repositórios de organizações, por membros com permissão adequada. Repositórios <strong>públicos</strong> são visíveis para qualquer pessoa na internet. Não existem configurações chamadas 'Secreto' ou 'Restrito' nas opções padrão de visibilidade de repositório do GitHub — essa é uma pegadinha comum em provas."
  }
];

let answered = 0, score = 0, multiSel = {};

function buildUI() {
  document.getElementById('quiz').innerHTML = questions.map(q => {
    const isMulti = q.correct.length > 1;
    let optsHTML = isMulti
      ? `<div class="multi-hint">⚠ Selecione ${q.correct.length} opções e confirme</div>`
      : '';
    optsHTML += `<div class="options" id="opts${q.id}">`;
    q.options.forEach(o => {
      optsHTML += `<div class="opt" id="opt${q.id}${o.l}" onclick="pick(${q.id},'${o.l}',${isMulti})">
        <div class="opt-bubble" id="bbl${q.id}${o.l}"></div>
        <div class="opt-letter">${o.l}</div>
        <div class="opt-text">${o.t}</div>
      </div>`;
    });
    optsHTML += `</div>`;
    if (isMulti) optsHTML += `<button class="confirm-btn" id="cbtn${q.id}" onclick="submitMulti(${q.id})" disabled>Confirmar resposta</button>`;
    optsHTML += `<div class="feedback" id="fb${q.id}"></div>`;

    return `<div class="qcard" id="card${q.id}">
      <div class="qcard-header">
        <div class="qnum">0${q.id}</div>
        <div class="qmeta">
          <div class="qtype">${q.type}</div>
          <div class="qtext">${q.text}</div>
        </div>
      </div>
      ${optsHTML}
    </div>`;
  }).join('');
}

function pick(qid, label, isMulti) {
  const allOpts = document.querySelectorAll(`[id^="opt${qid}"]`);
  if ([...allOpts].some(o => o.classList.contains('disabled'))) return;

  if (!isMulti) {
    allOpts.forEach(o => o.classList.add('disabled'));
    evalSingle(qid, label);
  } else {
    if (!multiSel[qid]) multiSel[qid] = new Set();
    const sel = multiSel[qid];
    const el = document.getElementById(`opt${qid}${label}`);
    const bbl = document.getElementById(`bbl${qid}${label}`);
    if (sel.has(label)) {
      sel.delete(label);
      el.classList.remove('sel-multi');
      bbl.textContent = '';
    } else {
      sel.add(label);
      el.classList.add('sel-multi');
      bbl.textContent = '✓';
    }
    const btn = document.getElementById(`cbtn${qid}`);
    const q = questions.find(x => x.id === qid);
    btn.disabled = sel.size !== q.correct.length;
  }
}

function submitMulti(qid) {
  const q = questions.find(x => x.id === qid);
  const allOpts = document.querySelectorAll(`[id^="opt${qid}"]`);
  allOpts.forEach(o => o.classList.add('disabled'));
  const btn = document.getElementById(`cbtn${qid}`);
  btn.style.display = 'none';

  const chosen = multiSel[qid] || new Set();
  const isOk = q.correct.every(c => chosen.has(c)) && chosen.size === q.correct.length;

  q.options.forEach(o => {
    const el = document.getElementById(`opt${qid}${o.l}`);
    const bbl = document.getElementById(`bbl${qid}${o.l}`);
    el.classList.remove('sel-multi');
    if (q.correct.includes(o.l) && chosen.has(o.l)) {
      el.classList.add('correct'); bbl.textContent = '✓';
    } else if (!q.correct.includes(o.l) && chosen.has(o.l)) {
      el.classList.add('wrong'); bbl.textContent = '✕';
    } else if (q.correct.includes(o.l) && !chosen.has(o.l)) {
      el.classList.add('missed'); bbl.textContent = '!';
    }
  });

  showFb(qid, isOk, q.explanation);
  tally(isOk);
}

function evalSingle(qid, chosen) {
  const q = questions.find(x => x.id === qid);
  const isOk = q.correct.includes(chosen);
  q.options.forEach(o => {
    const el = document.getElementById(`opt${qid}${o.l}`);
    const bbl = document.getElementById(`bbl${qid}${o.l}`);
    if (q.correct.includes(o.l)) { el.classList.add('correct'); bbl.textContent = '✓'; }
    else if (o.l === chosen) { el.classList.add('wrong'); bbl.textContent = '✕'; }
  });
  showFb(qid, isOk, q.explanation);
  tally(isOk);
}

function showFb(qid, isOk, explanation) {
  const fb = document.getElementById(`fb${qid}`);
  fb.className = `feedback ${isOk ? 'fb-ok' : 'fb-err'}`;
  fb.innerHTML = `
    <div class="fb-label">${isOk ? '✓ &nbsp; Correto' : '✕ &nbsp; Incorreto'}</div>
    <div class="fb-body">${explanation}</div>`;
}

function tally(isOk) {
  answered++;
  if (isOk) score++;
  const pct = Math.round(answered / questions.length * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${answered} de ${questions.length} respondidas`;
  document.getElementById('scoreLive').textContent = score;
  if (answered === questions.length) setTimeout(showResult, 900);
}

function showResult() {
  const pct = Math.round(score / questions.length * 100);
  const pass = pct >= 70;
  const panel = document.getElementById('result');
  panel.classList.add('show');
  panel.innerHTML = `
    <div class="result-ring ${pass ? 'pass' : 'fail'}">${pct}%</div>
    <div class="result-title">${pass ? 'APROVADO' : 'CONTINUE ESTUDANDO'}</div>
    <div class="result-sub">${pass ? 'Acima do mínimo exigido de 70% na GH-900' : 'Mínimo exigido na GH-900: 70%'}</div>
    <div class="result-stats">
      <div class="stat ok"><div class="stat-n">${score}</div><div class="stat-l">Corretas</div></div>
      <div class="stat err"><div class="stat-n">${questions.length - score}</div><div class="stat-l">Incorretas</div></div>
      <div class="stat pct"><div class="stat-n">${pct}%</div><div class="stat-l">Aproveitamento</div></div>
    </div>
    <button class="restart-btn" onclick="restart()">↺ &nbsp; Refazer simulado</button>
  `;
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function restart() {
  answered = 0; score = 0; multiSel = {};
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressLabel').textContent = '0 de 5 respondidas';
  document.getElementById('scoreLive').textContent = '0';
  const panel = document.getElementById('result');
  panel.classList.remove('show');
  panel.innerHTML = '';
  buildUI();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildUI();
</script>
</body>
</html>
